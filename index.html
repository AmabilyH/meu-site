<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesmo Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Quem nasceu no mesmo ano que você?</h1>
    <p class="intro">Cadastre seu nome e sua data de nascimento e veja quem mais nasceu no seu ano.</p>

    <div class="form">
      <label for="nome">Nome</label>
      <input id="nome" type="text" placeholder="Ex.: Maria Silva">

      <label for="data">Data de nascimento</label>
      <input id="data" type="date">

      <button id="cadastrar">Cadastrar</button>
      <p id="erro" class="erro"></p>
    </div>

    <section id="resultado"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
